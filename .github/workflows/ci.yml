name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm audit --omit=dev
      - run: bash -n proxmox/zephikyu-pngcalls.sh
      - run: bash -n proxmox/install.sh
      - run: bash -n proxmox/update.sh
      - run: bash -n proxmox/configure.sh
      - run: docker build -t zephikyu-pngcalls:test .
